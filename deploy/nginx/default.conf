# RoomLink reverse proxy
# - serves the admin dashboard at /
# - forwards /api/* to the Node payment backend (service name: api)

upstream roomlink_api {
    server api:4000;
}

server {
    listen 80;
    server_name _;

    # Admin dashboard (static)
    root /usr/share/nginx/html;
    index payments.html;

    location = / {
        try_files /payments.html =404;
    }

    # Payment API + webhook
    location /api/ {
        proxy_pass http://roomlink_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass http://roomlink_api/health;
    }

    # Static admin assets fallback
    location / {
        try_files $uri $uri/ =404;
    }
}

